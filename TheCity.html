<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The City</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#313338;color:#f2f3f5;font:15px Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:5px;padding:10px 14px;background:#5865f2;color:white}
button:hover{background:#4752c4}
button:disabled{opacity:.5;cursor:wait}
input{background:#1e1f22;border:1px solid #41434a;color:white;padding:12px;border-radius:5px;min-width:0}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.authbox{width:min(420px,100%);background:#232428;padding:32px;border-radius:12px}
.authbox h1{font-size:34px;margin:0 0 8px}
.muted{color:#b5bac1;line-height:1.5}
#authForm{display:grid;gap:12px;margin-top:24px}
#switch{width:100%;margin-top:12px;background:transparent;color:#c9cdfb}
#status{overflow-wrap:anywhere;font-size:13px}
#app{display:none;height:100dvh;grid-template-columns:76px 220px minmax(0,1fr)}
#servers{background:#1e1f22;padding:12px 8px;overflow-y:auto}
.server{width:56px;height:56px;border-radius:18px;background:#313338;margin-bottom:10px;font-size:20px;padding:0}
.server.active{border-radius:16px;background:#5865f2}
#sidebar{background:#2b2d31;display:flex;flex-direction:column;min-height:0}
#communityName{padding:20px 14px;font-size:18px;font-weight:bold;border-bottom:1px solid #202126;overflow-wrap:anywhere}
.section{padding:20px 12px 8px;color:#949ba4;font-size:12px;font-weight:bold}
.channel{margin:2px 8px;padding:10px;border-radius:5px;color:#b5bac1;cursor:pointer;overflow-wrap:anywhere}
.channel:hover,.channel.active{background:#404249;color:white}
#userPanel{margin-top:auto;background:#232428;padding:12px;display:flex;align-items:center;gap:8px;min-width:0}
#userName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:13px}
#logout{padding:8px;background:#404249}
#chat{display:flex;flex-direction:column;min-width:0;min-height:0}
#chatHeader{padding:18px 20px;border-bottom:1px solid #26272b;font-weight:bold}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.message{display:flex;gap:12px;overflow-wrap:anywhere}
.avatar{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:#5865f2;display:grid;place-items:center;font-weight:bold}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.messagebody{min-width:0}
.messagehead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.author{font-weight:bold}
.time{font-size:11px;color:#949ba4}
.content{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}\n.message-image{display:block;max-width:min(420px,100%);max-height:420px;object-fit:contain;border-radius:8px;margin-top:8px}
.reactions{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.reaction{background:#2b2d31;border:1px solid #41434a;padding:4px 8px;font-size:13px}
.reaction:hover{background:#404249}
.reaction.active{background:#414b82;border-color:#5865f2}
.reaction.add{background:transparent;color:#b5bac1}
#empty{color:#949ba4;margin:auto;text-align:center;line-height:1.7}
#composer{padding:0 20px 22px}
#messageForm{display:flex;gap:10px;background:#383a40;padding:8px;border-radius:8px}\n#imageButton{background:#404249;padding:10px 12px}\n#imageInput{display:none}
#messageInput{flex:1;background:transparent;border:0;outline:none}
#messageInput:focus{outline:none}
#notice{padding:0 20px 10px;color:#f0b232;font-size:13px}
#manageProfile{padding:8px;background:#404249}
#profileModal{display:none;position:fixed;inset:0;background:#0009;z-index:10;place-items:center;padding:20px}
#profileBox{width:min(420px,100%);background:#232428;padding:24px;border-radius:10px;display:flex;flex-direction:column;gap:12px}
#profileBox h2{margin:0 0 8px}
#profileBox label{font-size:13px;color:#b5bac1}
#profilePicture{width:100%}
#profilePreview{width:80px;height:80px;font-size:28px;overflow:hidden}
#profilePreview img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#profileStatus{font-size:13px;color:#f0b232;overflow-wrap:anywhere}
.profileButtons{display:flex;gap:10px}
#closeProfile{background:#404249}
@media(max-width:650px){
#app{grid-template-columns:58px 135px minmax(0,1fr)}
#servers{padding:8px 4px}
.server{width:48px;height:48px}
#communityName{font-size:15px;padding:16px 8px}
#messages{padding:12px}
#chatHeader{padding:16px 12px}
#composer{padding:0 10px 12px}
#messageForm{gap:5px}
#messageForm button{padding:10px}
#userPanel{padding:8px 4px;flex-wrap:wrap}
#userName{font-size:11px}
#logout{font-size:11px;padding:6px}
}
</style>
</head>
<body>
<section id="auth">
<div class="authbox">
<h1>🌆 The City</h1>
<p class="muted">Your place to chat, hang out, and build communities.</p>
<h2 id="authTitle">Welcome back</h2>
<form id="authForm">
<input id="email" type="email" placeholder="Email address" autocomplete="email" required>
<input id="password" type="password" placeholder="Password" autocomplete="current-password" minlength="6" required>
<button id="authButton">Log in</button>
</form>
<button id="switch" type="button">Need an account? Sign up</button>
<p id="status" class="muted">Connecting to The City...</p>
</div>
</section>

<div id="app">
<aside id="servers">
<button class="server active" title="The City">🌆</button>
</aside>
<aside id="sidebar">
<div id="communityName">The City</div>
<div class="section">TEXT CHANNELS</div>
<div id="channels"></div>
<div id="userPanel">
<div class="avatar">Y</div>
<div id="userName">User</div>
<button id="manageProfile">⚙</button>
<button id="logout">↪</button>
</div>
</aside>
<div id="profileModal">
  <div id="profileBox">
    <h2>Manage Profile</h2>
    <label for="profileUsername">Username</label>
    <input id="profileUsername" maxlength="24" placeholder="Your username">
    <label for="profilePicture">Profile picture</label>
    <input id="profilePicture" type="file">
    <div id="profilePreview" class="avatar">?</div>
    <p id="profileStatus"></p>
    <div class="profileButtons">
      <button id="saveProfile">Save Changes</button>
      <button id="closeProfile" type="button">Cancel</button>
    </div>
  </div>
</div>
<main id="chat">
<header id="chatHeader"># general</header>
<div id="messages">
<div id="empty">Welcome to The City!<br>Loading messages...</div>
</div>
<div id="notice"></div>
<div id="composer">
<form id="messageForm">
<input id="imageInput" type="file" accept="image/*">
<button id="imageButton" type="button" title="Attach an image">🖼️</button>
<input id="messageInput" maxlength="2000" placeholder="Message #general" autocomplete="off">
<button id="sendButton">Send</button>
</form>
</div>
</main>
</div>

<script>
const SUPABASE_URL = "https://ckirnbdsuvwadplpnwaj.supabase.co";
const SUPABASE_KEY = "sb_publishable_y-6e062z8kUxOItjBLNazg_P7C9mABq";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let user = null;
let community = null;
let channel = null;
let loginMode = true;
let refreshHandle = null;
let loadingMessages = false;
let lastMessageIds = "";
let selectedMessageImage = null;

function showStatus(message){
  $("status").textContent = message;
}

function showNotice(message){
  $("notice").textContent = message;
}

function escapeText(value){
  return String(value ?? "");
}

function initials(value){
  return (value || "?").trim().slice(0,1).toUpperCase();
}

function setAvatar(element, username, url){
  element.replaceChildren();

  if(url){
    const image = document.createElement("img");
    image.src = url;
    image.alt = username + "'s profile picture";
    image.onerror = () => {
      element.replaceChildren();
      element.textContent = initials(username);
    };
    element.append(image);
  }else{
    element.textContent = initials(username);
  }
}

function setAuthMode(){
  $("authTitle").textContent = loginMode ? "Welcome back" : "Create your account";
  $("authButton").textContent = loginMode ? "Log in" : "Create account";
  $("switch").textContent = loginMode ? "Need an account? Sign up" : "Already have an account? Log in";
  $("password").autocomplete = loginMode ? "current-password" : "new-password";
  showStatus("");
}

$("switch").onclick = () => {
  loginMode = !loginMode;
  setAuthMode();
};

$("authForm").onsubmit = async event => {
  event.preventDefault();
  $("authButton").disabled = true;
  showStatus("Please wait...");

  const email = $("email").value.trim();
  const password = $("password").value;
  let result;

  try {
    result = loginMode
      ? await db.auth.signInWithPassword({email,password})
      : await db.auth.signUp({email,password});

    if(result.error) throw result.error;

    if(!loginMode && !result.data.session){
      showStatus("Account created! Check your email if confirmation is required, then log in.");
      return;
    }

    if(result.data.session){
      await openApp(result.data.session.user);
    }
  } catch(error) {
    showStatus("Error: " + error.message);
  } finally {
    $("authButton").disabled = false;
  }
};

async function ensureProfile(){
  const {data: existing,error: findError} = await db
    .from("profiles")
    .select("id,username,avatar_url")
    .eq("id",user.id)
    .maybeSingle();

  if(findError) throw findError;
  if(existing) return existing;

  const base = (user.email || "citizen").split("@")[0]
    .replace(/[^a-zA-Z0-9_]/g,"").slice(0,18) || "citizen";

  for(let attempt=0;attempt<5;attempt++){
    const username = attempt===0 ? base : base + Math.floor(1000+Math.random()*9000);
    const {data,error} = await db.from("profiles")
      .insert({id:user.id,username})
      .select("id,username,avatar_url")
      .single();

    if(!error) return data;
    if(error.code==="23505") continue;
    if(error.code==="42501") throw new Error("Profile access denied. Check the profiles security policies.");
    throw error;
  }

  throw new Error("Couldn't create a unique username. Please try again.");
}

async function getOrCreateCommunity(){
  const {data: list,error} = await db.from("communities")
    .select("id,name,owner_id")
    .eq("is_public",true)
    .order("created_at",{ascending:true})
    .limit(1);

  if(error) throw error;
  if(list && list.length) return list[0];

  const {data,error:createError} = await db.from("communities")
    .insert({name:"The City",owner_id:user.id,is_public:true})
    .select("id,name,owner_id")
    .single();

  if(createError) throw createError;
  return data;
}

async function getOrCreateChannel(){
  const {data:list,error} = await db.from("channels")
    .select("id,name,type,position")
    .eq("community_id",community.id)
    .order("position",{ascending:true});

  if(error) throw error;
  if(list && list.length) return list;

  if(community.owner_id !== user.id){
    throw new Error("This community has no channels yet. Create your own server to start chatting.");
  }

  const {data,error:createError} = await db.from("channels")
    .insert([
      {community_id:community.id,name:"general",type:"text",position:0},
      {community_id:community.id,name:"memes",type:"text",position:1},
      {community_id:community.id,name:"gaming",type:"text",position:2}
    ])
    .select("id,name,type,position");

  if(createError) throw createError;
  return data || [];
}

function drawChannels(list){
  $("channels").replaceChildren();

  for(const item of list){
    const el = document.createElement("div");
    el.className = "channel" + (channel && item.id===channel.id ? " active" : "");
    el.textContent = "# " + item.name;
    el.onclick = () => selectChannel(item);
    $("channels").append(el);
  }
}

async function openApp(currentUser){
  user = currentUser;
  $("auth").style.display = "none";
  $("app").style.display = "grid";
  $("userName").textContent = user.email || "Citizen";
  $("userName").title = user.email || "";
  $("messages").replaceChildren();
  const empty = document.createElement("div");
  empty.id = "empty";
  empty.textContent = "Setting up your city...";
  $("messages").append(empty);
  showNotice("");

  try{
    const profile = await ensureProfile();
    $("userName").textContent = profile.username;
setAvatar($("userPanel").querySelector(".avatar"),profile.username,profile.avatar_url);

    community = await getOrCreateCommunity();
    $("communityName").textContent = community.name;

    const list = await getOrCreateChannel();
    drawChannels(list);

    if(list.length){
      await selectChannel(list[0]);
    } else {
      throw new Error("No channels found.");
    }
  }catch(error){
    showNotice(error.message);
    $("messages").replaceChildren();
    const empty = document.createElement("div");
    empty.id = "empty";
    empty.textContent = "The City couldn't finish loading. Check the message below.";
    $("messages").append(empty);
  }
}

async function selectChannel(item){
  channel = item;
  $("chatHeader").textContent = "# " + item.name;
  $("messageInput").placeholder = "Message #" + item.name;
  $("messageInput").disabled = false;
  $("sendButton").disabled = false;
  drawChannelsForCurrentCommunity();
  lastMessageIds = "";
  await loadMessages();
  startRefresh();
}

function drawChannelsForCurrentCommunity(){
  const items = Array.from($("channels").children);
  for(const el of items){
    el.classList.toggle("active",el.textContent === "# " + channel.name);
  }
}

async function toggleReaction(messageId,emoji){
  if(!user) return;

  const existing = await db.from("message_reactions")
    .select("message_id")
    .eq("message_id",messageId)
    .eq("user_id",user.id)
    .eq("emoji",emoji)
    .maybeSingle();

  if(existing.error){
    showNotice("Couldn't check reaction: " + existing.error.message);
    return;
  }

  let result;

  if(existing.data){
    result = await db.from("message_reactions")
      .delete()
      .eq("message_id",messageId)
      .eq("user_id",user.id)
      .eq("emoji",emoji);
  }else{
    result = await db.from("message_reactions")
      .insert({message_id:messageId,user_id:user.id,emoji});
  }

  if(result.error){
    showNotice("Couldn't save reaction: " + result.error.message);
    return;
  }

  lastMessageIds = "";
  await loadMessages();
}

async function loadMessages(){
  if(!channel || loadingMessages) return;
  loadingMessages = true;

  try{
    const {data:rows,error} = await db.from("messages")
      .select("id,channel_id,sender_id,content,created_at")
      .eq("channel_id",channel.id)
      .order("created_at",{ascending:true})
      .limit(100);

    if(error) throw error;

    const messageIds = (rows || []).map(m=>m.id);
let reactions = [];

if(messageIds.length){
  const {data,error:reactionError} = await db.from("message_reactions")
    .select("message_id,user_id,emoji")
    .in("message_id",messageIds);

  if(reactionError) throw reactionError;
  reactions = data || [];
}

const signature = messageIds.join(",") + "||" +
  reactions.map(r=>r.message_id + ":" + r.user_id + ":" + r.emoji).sort().join(",");

if(signature === lastMessageIds) return;
lastMessageIds = signature;

    const ids = [...new Set((rows || []).map(m=>m.sender_id))];
    let profiles = {};

    if(ids.length){
      const {data:people,error:profileError} = await db.from("profiles")
  .select("id,username,avatar_url")
  .in("id",ids);

if(profileError) throw profileError;
for(const person of people || []) profiles[person.id] = person;
    }

    const box = $("messages");
    box.replaceChildren();

    if(!rows || rows.length===0){
      const empty = document.createElement("div");
      empty.id = "empty";
      empty.textContent = "Welcome to #" + channel.name + "! Send the first message.";
      box.append(empty);
      return;
    }

    for(const message of rows){
      const row = document.createElement("div");
      row.className = "message";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      const person = profiles[message.sender_id] || {};
const username = person.username || "Citizen";
setAvatar(avatar,username,person.avatar_url);

      const body = document.createElement("div");
      body.className = "messagebody";

      const head = document.createElement("div");
      head.className = "messagehead";

      const author = document.createElement("span");
      author.className = "author";
      author.textContent = username;

      const time = document.createElement("span");
      time.className = "time";
      time.textContent = new Date(message.created_at).toLocaleString();

      const content = document.createElement("div");
      content.className = "content";
      const attachmentPrefix = "__CITY_ATTACHMENT__";
      head.append(author,time);

      if(message.content && message.content.startsWith(attachmentPrefix)){
        try{
          const attachment = JSON.parse(message.content.slice(attachmentPrefix.length));
          body.append(head);
          if(attachment.text){
            content.textContent = attachment.text;
            body.append(content);
          }
          const image = document.createElement("img");
          image.className = "message-image";
          image.src = attachment.url;
          image.alt = "Image attachment";
          image.loading = "lazy";
          image.onerror = () => image.alt = "Image could not be loaded";
          body.append(image);
        }catch{
          content.textContent = escapeText(message.content);
          body.append(head,content);
        }
      }else{
        content.textContent = escapeText(message.content);
        body.append(head,content);
      }
      const reactionBar = document.createElement("div");
reactionBar.className = "reactions";

const emojis = ["😂","💀","🔥","❤️","😭","👍"];
const messageReactions = reactions.filter(r=>r.message_id===message.id);

for(const emoji of emojis){
  const matching = messageReactions.filter(r=>r.emoji===emoji);
  const button = document.createElement("button");
  button.className = "reaction" +
    (matching.some(r=>r.user_id===user.id) ? " active" : "");
  button.textContent = emoji + (matching.length ? " " + matching.length : "");
  button.title = matching.map(r=>r.user_id).includes(user.id)
    ? "Remove your reaction"
    : "React with " + emoji;
  button.onclick = () => toggleReaction(message.id,emoji);
  reactionBar.append(button);
}

body.append(reactionBar);
row.append(avatar,body);
      box.append(row);
    }

    box.scrollTop = box.scrollHeight;
  }catch(error){
    showNotice("Couldn't load messages: " + error.message);
  }finally{
    loadingMessages = false;
  }
}

function startRefresh(){
  if(refreshHandle) clearInterval(refreshHandle);
  refreshHandle = setInterval(loadMessages,3000);
}

$("imageButton").onclick = () => $("imageInput").click();

$("imageInput").onchange = () => {
  const file = $("imageInput").files[0];
  if(!file) return;

  if(!file.type.startsWith("image/")){
    showNotice("Choose an image file.");
    $("imageInput").value = "";
    return;
  }

  if(file.size > 5 * 1024 * 1024){
    showNotice("Images must be 5 MB or smaller.");
    $("imageInput").value = "";
    return;
  }

  selectedMessageImage = file;
  showNotice("Image attached: " + file.name + " (up to 5 MB)");
};

$("messageForm").onsubmit = async event => {
  event.preventDefault();
  if(!user || !channel) return;

  const text = $("messageInput").value.trim();
  if(!text && !selectedMessageImage) return;

  $("sendButton").disabled = true;
  $("imageButton").disabled = true;
  showNotice("");

  try{
    let content = text;

    if(selectedMessageImage){
      const file = selectedMessageImage;
      const extension = file.name.includes(".")
        ? file.name.split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"")
        : "img";
      const path = user.id + "/" + crypto.randomUUID() + "." + (extension || "img");

      showNotice("Uploading image...");
      const {error:uploadError} = await db.storage
        .from("message-images")
        .upload(path,file,{upsert:false,contentType:file.type});

      if(uploadError) throw uploadError;

      const {data:urlData} = db.storage.from("message-images").getPublicUrl(path);
      content = "__CITY_ATTACHMENT__" + JSON.stringify({url:urlData.publicUrl,text});
    }

    const {error} = await db.from("messages").insert({
      channel_id:channel.id,
      sender_id:user.id,
      content
    });

    if(error) throw error;

    $("messageInput").value = "";
    $("imageInput").value = "";
    selectedMessageImage = null;
    showNotice("");
    lastMessageIds = "";
    await loadMessages();
  }catch(error){
    showNotice("Message not sent: " + error.message);
  }finally{
    $("sendButton").disabled = false;
    $("imageButton").disabled = false;
    $("messageInput").focus();
  }
};

$("logout").onclick = async () => {
  if(refreshHandle) clearInterval(refreshHandle);
  refreshHandle = null;
  const {error} = await db.auth.signOut();
  if(error){
    showNotice("Couldn't log out: " + error.message);
    return;
  }

  user = null;
  community = null;
  channel = null;
  $("app").style.display = "none";
  $("auth").style.display = "grid";
  loginMode = true;
  setAuthMode();
  showStatus("Logged out.");
};

async function start(){
  if(SUPABASE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE"){
    showStatus("Add your Supabase publishable key in the code first.");
    return;
  }

  try{
    const {data,error} = await db.auth.getSession();
    if(error) throw error;

    if(data.session){
      await openApp(data.session.user);
    }else{
      showStatus("Ready! Log in or create an account.");
    }

    db.auth.onAuthStateChange((event,session)=>{
      if(event==="SIGNED_OUT" && !session){
        if(refreshHandle) clearInterval(refreshHandle);
        refreshHandle = null;
      }
    });
  }catch(error){
    showStatus("Connection error: " + error.message);
  }
}

let currentProfile = null;
let selectedAvatarFile = null;

$("manageProfile").onclick = async () => {
  if(!user) return;

  $("profileStatus").textContent = "Loading profile...";
  $("profileModal").style.display = "grid";
  $("profileUsername").value = $("userName").textContent;
  $("profilePicture").value = "";
  selectedAvatarFile = null;

  try{
    const {data,error} = await db.from("profiles")
      .select("id,username,avatar_url")
      .eq("id",user.id)
      .single();

    if(error) throw error;

    currentProfile = data;
    $("profileUsername").value = data.username;
    setAvatar($("profilePreview"),data.username,data.avatar_url);
    $("profileStatus").textContent = "";
  }catch(error){
    $("profileStatus").textContent = "Couldn't load profile: " + error.message;
  }
};

$("profilePicture").onchange = () => {
  const file = $("profilePicture").files[0];
  if(!file) return;

  selectedAvatarFile = file;
  const previewUrl = URL.createObjectURL(file);
  setAvatar($("profilePreview"),$("profileUsername").value || "?",previewUrl);
  $("profileStatus").textContent = "Picture selected: " + file.name;
};

$("profileUsername").oninput = () => {
  if(!selectedAvatarFile){
    setAvatar($("profilePreview"),$("profileUsername").value,currentProfile?.avatar_url);
  }
};

$("closeProfile").onclick = () => {
  $("profileModal").style.display = "none";
};

$("profileModal").onclick = event => {
  if(event.target === $("profileModal")){
    $("profileModal").style.display = "none";
  }
};

$("saveProfile").onclick = async () => {
  if(!user || !currentProfile) return;

  const username = $("profileUsername").value.trim();

  if(!username){
    $("profileStatus").textContent = "Enter a username first.";
    return;
  }

  if(username.length > 24){
    $("profileStatus").textContent = "Usernames must be 24 characters or fewer.";
    return;
  }

  $("saveProfile").disabled = true;
  $("profileStatus").textContent = "Saving profile...";

  try{
    let avatarUrl = currentProfile.avatar_url;

    if(selectedAvatarFile){
      const extension = selectedAvatarFile.name.includes(".")
        ? selectedAvatarFile.name.split(".").pop().toLowerCase()
        : "bin";

      const path = user.id + "/" + crypto.randomUUID() + "." + extension;

      const {error:uploadError} = await db.storage
        .from("avatars")
        .upload(path,selectedAvatarFile,{upsert:false});

      if(uploadError) throw uploadError;

      const {data:urlData} = db.storage.from("avatars").getPublicUrl(path);
      avatarUrl = urlData.publicUrl;
    }

console.log("Logged-in user ID:",user.id);
console.log("Profile ID:",currentProfile.id);

    const {data,error} = await db.from("profiles")
      .update({username,avatar_url:avatarUrl})
      .eq("id",user.id)
      .select("id,username,avatar_url")
      .single();

    if(error) throw error;

    currentProfile = data;
    $("userName").textContent = data.username;
    setAvatar($("userPanel").querySelector(".avatar"),data.username,data.avatar_url);
$("profileStatus").textContent = "Profile saved!";
selectedAvatarFile = null;
lastMessageIds = "";
await loadMessages();

    setTimeout(() => {
      $("profileModal").style.display = "none";
    },700);
  }catch(error){
    $("profileStatus").textContent = "Couldn't save profile: " + error.message;
  }finally{
    $("saveProfile").disabled = false;
  }
};

start();
</script>
</body>
</html>
